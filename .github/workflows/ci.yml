name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Resolve locked packages
        run: xcodebuild -resolvePackageDependencies -project Piqo.xcodeproj
      - name: Build application
        run: xcodebuild -project Piqo.xcodeproj -scheme Piqo -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run protocol/runtime/data tests
        run: cd Packages/PiqoKit && swift test
