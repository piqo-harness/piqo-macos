name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26-arm64
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p '' "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p '' "$keychain"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain"
      - name: Package, sign, notarize and staple
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEYCHAIN_PROFILE: ${{ secrets.NOTARY_KEYCHAIN_PROFILE }}
          SPARKLE_EDDSA_PUBLIC_KEY: ${{ secrets.SPARKLE_EDDSA_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle-private-key
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_PRIVATE_KEY_FILE"
          scripts/package-release.sh "${{ inputs.tag }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/${{ inputs.tag }}/*
